<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アンテナショップ・ルーレット</title>
<style>
  :root {
    --bg: #faf6ee; --fg: #2b2622; --muted: #6f665c; --card: #fff;
    --line: #e4dccd; --accent: #c8452f; --accent-fg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1b18; --fg: #f3ede3; --muted: #b3a999; --card: #2a2622;
      --line: #443d35; --accent: #e8664e; --accent-fg: #1e1b18;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0; }
  .lead { margin: 4px 0 16px; color: var(--muted); font-size: .9rem; }
  .wheel { position: relative; width: min(100%, 400px); margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; }
  .pointer {
    position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border: 14px solid transparent; border-bottom: 0;
    border-top: 26px solid var(--accent);
  }
  .current { min-height: 3.2em; margin: 12px 0; font-weight: 600; }
  button {
    font: inherit; font-weight: 700; font-size: 1.1rem; padding: 12px 48px;
    border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-fg);
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .result {
    margin-top: 20px; padding: 20px 16px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;
  }
  .result[hidden] { display: none; }
  .result p { margin: 0; color: var(--muted); font-size: .9rem; }
  .result h2 { margin: 4px 0 16px; font-size: 1.25rem; overflow-wrap: anywhere; }
  .map {
    display: block; padding: 12px; border-radius: 8px; font-weight: 700;
    background: var(--accent); color: var(--accent-fg); text-decoration: none;
  }
  .official { display: inline-block; margin-top: 12px; color: var(--fg); font-size: .9rem; }
  footer { margin-top: 28px; color: var(--muted); font-size: .8rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>アンテナショップ・ルーレット</h1>
  <p class="lead">東京の54店舗から、次に行くお店を1つ決めます</p>

  <div class="wheel">
    <canvas id="wheel" width="800" height="800" role="img" aria-label="54店舗のルーレット"></canvas>
    <div class="pointer"></div>
  </div>
  <div class="current" id="current" aria-hidden="true"></div>
  <button id="spin" type="button">まわす</button>

  <section class="result" id="result" aria-live="polite" hidden>
    <p id="result-pref"></p>
    <h2 id="result-name"></h2>
    <a class="map" id="result-map" target="_blank" rel="noopener">Google マップで開く</a>
    <a class="official" id="result-official" target="_blank" rel="noopener">公式の店舗紹介を見る</a>
  </section>

  <footer>店舗情報の出典: <a href="https://tokyo-antennashop.jp/shop-list/" target="_blank" rel="noopener">ラリー参加店舗一覧</a></footer>
</main>

<script src="shops.js"></script>
<script>
  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spin");
  const currentEl = document.getElementById("current");
  const resultEl = document.getElementById("result");

  const COLORS = ["#c8452f", "#e0a030", "#3f8f6b", "#2f6f9f", "#8a5a9e", "#d9774a"];
  const SPIN_MS = 4000;
  const TURNS = 6;
  const SLICE = (Math.PI * 2) / SHOPS.length;
  const TWO_PI = Math.PI * 2;
  let rotation = 0; // 0 のとき店舗0の扇形の始点が針（真上）にある

  function draw() {
    const c = canvas.width / 2;
    const r = c - 8;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(rotation - Math.PI / 2);
    SHOPS.forEach((_, i) => {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, i * SLICE, (i + 1) * SLICE);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.rotate((i + 0.5) * SLICE);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 22px system-ui, sans-serif";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(String(i + 1), r - 14, 0);
      ctx.restore();
    });
    ctx.restore();

    ctx.beginPath();
    ctx.arc(c, c, 44, 0, TWO_PI);
    ctx.fillStyle = "#fff";
    ctx.fill();
  }

  // 針の下にある店舗の番号
  function indexAtPointer(rot) {
    const a = ((-rot % TWO_PI) + TWO_PI) % TWO_PI;
    return Math.min(Math.floor(a / SLICE), SHOPS.length - 1);
  }

  // 偏りのない 0 以上 n 未満の整数
  function randomInt(n) {
    const limit = Math.floor(0x100000000 / n) * n;
    const buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % n;
  }

  function showCurrent(i) {
    currentEl.textContent = `${i + 1}. ${SHOPS[i].name}`;
  }

  function showResult(i) {
    const shop = SHOPS[i];
    document.getElementById("result-pref").textContent = shop.prefecture;
    document.getElementById("result-name").textContent = shop.name;
    document.getElementById("result-map").href =
      "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(shop.mapQuery || shop.name);
    document.getElementById("result-official").href = shop.officialUrl;
    resultEl.hidden = false;
    spinBtn.disabled = false;
    spinBtn.textContent = "もう一度まわす";
  }

  function spin() {
    const winner = randomInt(SHOPS.length);
    spinBtn.disabled = true;
    resultEl.hidden = true;

    // 当選店の扇形の内側（境界を避ける）に針が来る角度
    const offset = (0.1 + Math.random() * 0.8) * SLICE;
    const base = -(winner * SLICE + offset);
    const from = rotation;
    const delta = ((base - from) % TWO_PI + TWO_PI) % TWO_PI;

    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      rotation = from + delta;
      draw();
      showCurrent(winner);
      showResult(winner);
      return;
    }

    const distance = delta + TURNS * TWO_PI;
    const start = performance.now();
    function frame(now) {
      const t = Math.min((now - start) / SPIN_MS, 1);
      rotation = from + distance * (1 - Math.pow(1 - t, 4));
      draw();
      showCurrent(indexAtPointer(rotation));
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        showResult(winner);
      }
    }
    requestAnimationFrame(frame);
  }

  spinBtn.addEventListener("click", spin);
  draw();
</script>
</body>
</html>
